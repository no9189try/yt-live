plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.ytstreamer'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.ytstreamer"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // RTMP streaming library (camera + mic capture -> RTMP)
    // https://github.com/pedroSG94/RootEncoder
    implementation 'com.github.pedroSG94.RootEncoder:library:2.8.1'
    // extra-sources: adds CameraUvcSource (external UVC camera / HDMI capture card via USB-OTG)
    // and CameraXSource. Required for the external capture card feature.
    implementation 'com.github.pedroSG94.RootEncoder:extra-sources:2.8.1'

    // For picking a logo/image from gallery (modern Photo Picker, no storage permission needed)
    implementation 'androidx.activity:activity-ktx:1.9.0'
}
